events {}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cdn_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;

        location / {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache my_cdn_cache;
            proxy_cache_methods GET;
            proxy_cache_bypass $request_method;
            proxy_no_cache $request_method;

            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout;

            proxy_pass http://bidflow:8080;
        }
    }
}
